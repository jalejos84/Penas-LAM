function defaultArticleState(){return {attempts:0,correct:0,wrong:0,flashSeen:0,ease:2.5,interval:0,repetitions:0,lastStudy:null,nextReview:null,updatedAt:null,errors:{articulo:0,pena:0,minima:0,maxima:0,agravante:0,comiso:0,inconmutabilidad:0,reincidencia:0,suspension:0,cancelacion:0}}}

function recentAttempts(n,limit=10){return state.attemptLog.filter(x=>x.articulo===Number(n)).slice(-limit)}
function domain(n){const p=state.progress[n]||defaultArticleState();if(!p.attempts&&!p.flashSeen)return 0;const acc=p.attempts?p.correct/p.attempts:0;const recent=recentAttempts(n,10);const racc=recent.length?recent.filter(x=>x.correct).length/recent.length:acc;const practice=Math.min(1,p.attempts/8);const flash=Math.min(1,p.flashSeen/4);let recency=.2;if(p.lastStudy){const d=(Date.now()-new Date(p.lastStudy).getTime())/86400000;recency=Math.exp(-d/18)}let score=Math.round(100*(acc*.34+racc*.30+practice*.16+flash*.10+recency*.10));if(p.attempts<2)score=Math.min(score,39);else if(p.attempts<4)score=Math.min(score,69);else if(p.attempts<6)score=Math.min(score,89);return clamp(score,0,100)}
function level(score){return score<40?'weak':score<70?'progress':score<90?'strong':'mastered'}
function due(n){const p=state.progress[n];return !p.nextReview||new Date(p.nextReview)<=new Date()}
function scheduleSM2(n,quality){const p=state.progress[n];if(quality<3){p.repetitions=0;p.interval=1}else{p.repetitions++;if(p.repetitions===1)p.interval=1;else if(p.repetitions===2)p.interval=3;else p.interval=Math.max(1,Math.round(p.interval*p.ease));p.ease=Math.max(1.3,p.ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02)))}const d=new Date();d.setDate(d.getDate()+p.interval);p.nextReview=d.toISOString();}
function recordAttempt(n,correct,type,errorType=null,meta={}){n=Number(n);const p=state.progress[n];p.attempts++;correct?p.correct++:p.wrong++;p.lastStudy=nowISO();p.updatedAt=nowISO();scheduleSM2(n,correct?5:2);if(!correct&&errorType&&p.errors[errorType]!=null)p.errors[errorType]++;state.attemptLog.push({id:uid(),articulo:n,correct,type,errorType,at:nowISO(),synced:false,...meta});if(state.attemptLog.length>5000)state.attemptLog=state.attemptLog.slice(-5000);saveState()}
function penaltySummary(a){const bits=[];if(a.penas.length)bits.push(a.penas.map(p=>`${p.escenario}: ${p.texto}${p.inconmutable?'':' (el artículo no dice “inconmutables” en este supuesto)'}`).join(' · '));if(a.multa)bits.push(a.multa);if(a.comiso)bits.push(a.comiso);if(a.suspension)bits.push(a.suspension);if(a.cancelacion)bits.push(a.cancelacion);if(a.inhabilitacion)bits.push(a.inhabilitacion);return bits.join(' | ')||'Este artículo no establece pena o sanción propia.'}
function penaltyCompact(a){if(a.penas.length)return a.penas.map(p=>`${p.min}–${p.max} ${p.unidad}${p.inconmutable?' inconmutables':''}`).join(' / ');if(a.multa)return a.multa;return 'Sin pena propia'}
function consequenceList(a){let x=[];if(a.multa)x.push(['Multa',a.multa]);if(a.comiso)x.push(['Comiso',a.comiso]);if(a.agravantes?.length)x.push(['Agravantes',a.agravantes.join(' ')]);if(a.reincidencia)x.push(['Reincidencia',a.reincidencia]);if(a.suspension)x.push(['Suspensión',a.suspension]);if(a.cancelacion)x.push(['Cancelación',a.cancelacion]);if(a.inhabilitacion)x.push(['Inhabilitación',a.inhabilitacion]);if(a.otras?.length)x.push(['Otras consecuencias',a.otras.join(' ')]);return x}

function revealFlash(){document.getElementById('flashAnswer').classList.remove('hide')}
function gradeFlash(n,ok){const p=state.progress[n];p.flashSeen++;p.lastStudy=nowISO();p.updatedAt=nowISO();scheduleSM2(n,ok?5:2);state.attemptLog.push({id:uid(),articulo:n,correct:ok,type:'flashcard',errorType:ok?null:'pena',at:nowISO(),synced:false});saveState();flashIndex=(flashIndex+1)%40;renderFlashcards()}
function penaltyExamCompact(a){if(a.penas.length)return a.penas.map(p=>`${p.min}–${p.max} ${p.unidad}`).join(' / ');if(a.multa)return a.multa;return 'Sin pena propia'}
function penaltyExamSummary(a){const bits=[];if(a.penas.length)bits.push(a.penas.map(p=>`${p.escenario}: ${p.min} a ${p.max} ${p.unidad}`).join(' · '));if(a.multa)bits.push(a.multa);if(a.comiso)bits.push(a.comiso);if(a.suspension)bits.push(a.suspension);if(a.cancelacion)bits.push(a.cancelacion);if(a.inhabilitacion)bits.push(a.inhabilitacion);return bits.join(' | ')||'Este artículo no establece pena o sanción propia.'}
function aggravanteExamSummary(a){return a.agravantes.length?a.agravantes.join(' | '):'No establece agravante específica.'}
function makePenaltyOptions(a){const correct=penaltyExamCompact(a);let pool=shuffle(arr().filter(x=>x.numero!==a.numero).map(penaltyExamCompact).filter(x=>x!==correct));return shuffle([correct,...[...new Set(pool)].slice(0,3)])}
function makeAggravanteOptions(a,correct){let pool=arr().filter(x=>x.numero!==a.numero).flatMap(x=>x.agravantes).filter(x=>x&&x!==correct&&!a.agravantes.includes(x));pool=shuffle([...new Set(pool)]);return shuffle([correct,...pool.slice(0,3)])}
function qFor(a,type){
  if(type==='penalty'){let opts=makePenaltyOptions(a);return {articulo:a.numero,type:'penalty',focus:'Pena',errorType:'pena',prompt:`¿Cuál es la pena o consecuencia principal de “${a.titulo}”?`,options:opts,answer:penaltyExamCompact(a),explain:penaltyExamSummary(a)}}
  if(type==='aggravante'){let correct=a.agravantes.length?shuffle(a.agravantes)[0]:'No establece agravante específica.';return {articulo:a.numero,type:'aggravante',focus:'Agravante',errorType:'agravante',prompt:`¿Cuál de estas opciones corresponde a una agravante o regla agravada de “${a.titulo}”?`,options:makeAggravanteOptions(a,correct),answer:correct,explain:aggravanteExamSummary(a)}}
  if(type==='vf'){let testAggravante=Math.random()<.5;if(testAggravante){let isTrue=Math.random()<.5,stmt;if(isTrue){stmt=a.agravantes.length?`En “${a.titulo}”, una agravante o regla agravada es: ${shuffle(a.agravantes)[0]}`:`“${a.titulo}” no establece agravante específica.`}else{let pool=arr().filter(x=>x.numero!==a.numero).flatMap(x=>x.agravantes).filter(x=>x&&!a.agravantes.includes(x));stmt=`En “${a.titulo}”, una agravante o regla agravada es: ${shuffle(pool)[0]}`};return {articulo:a.numero,type:'vf',focus:'Agravante',errorType:'agravante',prompt:stmt,options:['Verdadero','Falso'],answer:isTrue?'Verdadero':'Falso',explain:aggravanteExamSummary(a)}}let correct=penaltyExamCompact(a),isTrue=Math.random()<.5,pool=shuffle(arr().filter(x=>x.numero!==a.numero).map(penaltyExamCompact).filter(x=>x!==correct)),stated=isTrue?correct:pool[0];return {articulo:a.numero,type:'vf',focus:'Pena',errorType:'pena',prompt:`Para “${a.titulo}”, la pena o consecuencia principal es: ${stated}.`,options:['Verdadero','Falso'],answer:isTrue?'Verdadero':'Falso',explain:penaltyExamSummary(a)}}
  if(type==='writtenAggravante')return {articulo:a.numero,type:'writtenAggravante',focus:'Agravante escrita',errorType:'agravante',prompt:`Escribe de memoria los agravantes o reglas agravadas de “${a.titulo}”. Si no establece agravante específica, indícalo.`,written:true,answer:aggravanteExamSummary(a),explain:'Compara tu respuesta con el texto estructurado de la ley.'}
  return {articulo:a.numero,type:'writtenPenalty',focus:'Pena escrita',errorType:'pena',prompt:`Escribe de memoria la pena, multa, comiso y demás consecuencias de “${a.titulo}”.`,written:true,answer:penaltyExamSummary(a),explain:'La conmutabilidad o inconmutabilidad no forma parte de la calificación de este examen.'}
}
function buildQuestions(count=12,scope=null){let source=scope?scope.map(n=>ARTICULOS[n]):arr();source=shuffle(source);let qs=[];const types=['penalty','aggravante','vf','writtenPenalty','writtenAggravante','penalty','aggravante'];for(let i=0;i<count;i++){let a=source[i%source.length];let t=types[i%types.length];qs.push(qFor(a,t))}return shuffle(qs)}
function renderQuizHome(){main.innerHTML=header('Preguntas','Penas y agravantes: V/F, opción múltiple y respuesta escrita')+`<div class="grid two"><div class="card"><h3>Entrenamiento adaptativo</h3><p class="muted">Prioriza temas débiles y repeticiones vencidas. No pregunta números de artículos.</p><div class="toolbar"><button class="btn primary" onclick="startQuickQuiz()">12 preguntas</button><button class="btn" onclick="startDueQuiz()">Solo vencidos/débiles</button></div></div><div class="card"><h3>Práctica dirigida</h3><p class="muted">Practica únicamente lo que necesitas memorizar para el examen.</p><div class="toolbar"><button class="btn" onclick="startPenaltyQuiz()">Pena rápida</button><button class="btn" onclick="startAggravanteQuiz()">Agravantes</button></div></div></div>`}
function startQuickQuiz(){let weak=arr().sort((a,b)=>(due(b.numero)-due(a.numero))||domain(a.numero)-domain(b.numero)).slice(0,20).map(a=>a.numero);startSession(buildQuestions(12,weak),'Práctica')}
function startDueQuiz(){let nums=arr().filter(a=>due(a.numero)||domain(a.numero)<70).map(a=>a.numero);if(!nums.length)nums=arr().map(a=>a.numero);startSession(buildQuestions(Math.min(15,Math.max(8,nums.length)),nums),'Repaso')}
function startPenaltyQuiz(){let nums=arr().map(a=>a.numero);let qs=shuffle(nums).slice(0,15).map(n=>qFor(ARTICULOS[n],'penalty'));startSession(qs,'Pena rápida')}
function startAggravanteQuiz(){let nums=arr().map(a=>a.numero);let qs=shuffle(nums).slice(0,15).map(n=>qFor(ARTICULOS[n],'aggravante'));startSession(qs,'Agravantes')}
function studyTest(n){startSession([qFor(ARTICULOS[n],'penalty'),qFor(ARTICULOS[n],'aggravante'),qFor(ARTICULOS[n],'writtenPenalty'),qFor(ARTICULOS[n],'writtenAggravante')],ARTICULOS[n].titulo)}
function startSession(qs,label='Práctica'){quizSession={qs,index:0,score:0,label,answered:false,start:nowISO()};currentView='quizrun';renderQuizRun()}
function renderQuizRun(){const s=quizSession,q=s.qs[s.index];main.innerHTML=header(s.label,`Pregunta ${s.index+1} de ${s.qs.length}`)+`<div class="quiz-wrap"><div class="card"><div class="quiz-meta"><span>${esc(q.focus||'Pena / agravante')}</span><span>Puntaje ${s.score}/${s.index}</span></div><div class="quiz-q">${esc(q.prompt)}</div>${q.written?`<textarea id="writtenAns" class="written" placeholder="Escribe lo que recuerdes..."></textarea><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="revealWritten()">Comparar con la ley</button></div><div id="writtenReveal" class="hide"><div class="feedback"><b>Respuesta esperada</b><p>${esc(q.answer)}</p><p class="muted">${esc(q.explain)}</p></div><div class="toolbar" style="margin-top:10px"><button class="btn bad" onclick="gradeWritten(false)">Me faltó / incorrecta</button><button class="btn ok" onclick="gradeWritten(true)">Correcta</button></div></div>`:`<div class="choices">${q.options.map((o,i)=>`<button class="choice" data-o="${esc(o)}" onclick="answerChoice(this,${JSON.stringify(o)})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div>`}</div></div>`}
function revealWritten(){document.getElementById('writtenReveal').classList.remove('hide')}
function gradeWritten(ok){if(quizSession.answered)return;quizSession.answered=true;const q=quizSession.qs[quizSession.index];if(ok)quizSession.score++;recordAttempt(q.articulo,ok,q.type,ok?null:q.errorType,{selfGraded:true});nextButton()}
function answerChoice(btn,value){if(quizSession.answered)return;quizSession.answered=true;const q=quizSession.qs[quizSession.index],ok=String(value)===String(q.answer);if(ok)quizSession.score++;document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.o===String(q.answer))x.classList.add('correct')});if(!ok)btn.classList.add('wrong');recordAttempt(q.articulo,ok,q.type,ok?null:q.errorType);document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'Correcto':'Incorrecto'}</b><p>${esc(q.explain)}</p></div>`;nextButton()}
function nextButton(){let root=document.querySelector('.quiz-wrap .card');root.insertAdjacentHTML('beforeend',`<div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="nextQuestion()">${quizSession.index+1>=quizSession.qs.length?'Ver resultado':'Siguiente →'}</button></div>`)}
function nextQuestion(){if(quizSession.index+1>=quizSession.qs.length){finishSession();return}quizSession.index++;quizSession.answered=false;renderQuizRun()}
function finishSession(){const s=quizSession,pct=Math.round(100*s.score/s.qs.length);state.examHistory.push({id:uid(),label:s.label,score:s.score,total:s.qs.length,pct,at:nowISO()});saveState();main.innerHTML=header('Resultado',s.label)+`<div class="quiz-wrap"><div class="card" style="text-align:center"><div style="font-size:64px;font-weight:900">${pct}%</div><h3>${s.score} de ${s.qs.length} correctas</h3><p class="muted">Los errores de pena y agravantes quedaron registrados para priorizar próximos repasos.</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="showView('errores')">Revisar errores</button><button class="btn" onclick="showView('dashboard')">Dashboard</button></div></div></div>`}
function renderExamHome(){const last=state.examHistory.slice(-5).reverse();main.innerHTML=header('Simulador de examen','V/F, multiple choice y respuesta escrita sobre penas y agravantes')+`<div class="grid two"><div class="card"><h3>Simulador</h3><p class="muted">No pregunta números de artículos ni conmutabilidad/inconmutabilidad. Se concentra en penas, multas, comiso, agravantes y demás consecuencias.</p><div class="toolbar"><button class="btn primary" onclick="startExam(20)">20 preguntas</button><button class="btn" onclick="startExam(40)">40 preguntas</button></div></div><div class="card"><h3>Últimos resultados</h3>${last.length?last.map(x=>`<div class="article-row"><div class="num">${x.pct}%</div><div><b>${esc(x.label)}</b><p>${new Date(x.at).toLocaleString()}</p></div><span class="pill">${x.score}/${x.total}</span></div>`).join(''):'<p class="muted">Aún no hay simuladores completados.</p>'}</div></div>`}
function startExam(n){let qs=buildQuestions(n,arr().map(a=>a.numero));startSession(qs,'Simulador de examen')}
function renderPenas(){main.innerHTML=header('Tabla y mapa de penas','Comparación rápida sin inventar distractores')+`<div class="card" style="overflow:auto"><table class="table"><thead><tr><th>Art.</th><th>Título</th><th>Pena / multa</th><th>Inconmutabilidad</th><th>Comiso / otras</th></tr></thead><tbody>${arr().map(a=>`<tr><td><button class="btn" onclick="openArticle(${a.numero})">${a.numero}</button></td><td>${esc(a.titulo)}</td><td>${esc(penaltyCompact(a))}${a.multa?`<br>${esc(a.multa)}`:''}</td><td>${a.penas.length?a.penas.map(p=>`${esc(p.escenario)}: ${p.inconmutable?'Sí':'No expresada'}`).join('<br>'):'—'}</td><td>${esc([a.comiso,a.suspension,a.cancelacion,a.inhabilitacion].filter(Boolean).join(' · ')||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function renderErrors(){let items=arr().map(a=>{let e=Object.values(state.progress[a.numero].errors).reduce((x,y)=>x+y,0);return {a,e}}).filter(x=>x.e).sort((x,y)=>y.e-x.e);main.innerHTML=header('Revisión de errores','Artículos y categorías que más confundes')+`<div class="grid two"><div class="card"><h3>Por artículo</h3>${items.length?items.map(({a,e})=>`<div class="article-row"><div class="num">${a.numero}</div><div><b>${esc(a.titulo)}</b><p>${Object.entries(state.progress[a.numero].errors).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(' · ')}</p></div><span class="pill">${e} errores</span></div>`).join(''):'<p class="muted">Todavía no hay errores registrados.</p>'}</div><div class="card"><h3>Qué practicar</h3><p class="muted">La cola adaptativa da prioridad a los artículos con dominio bajo, errores recientes o fecha de repaso vencida.</p><button class="btn primary" onclick="startDueQuiz()">Practicar errores ahora</button></div></div>`}
function renderCompare(){main.innerHTML=header('Comparar artículos','Útil para detectar artículos confundidos')+`<div class="card"><div class="toolbar"><select id="cmpA" class="search">${arr().map(a=>`<option value="${a.numero}">${a.numero} · ${esc(a.titulo)}</option>`).join('')}</select><select id="cmpB" class="search">${arr().map(a=>`<option value="${a.numero}" ${a.numero===123?'selected':''}>${a.numero} · ${esc(a.titulo)}</option>`).join('')}</select><button class="btn primary" onclick="doCompare()">Comparar</button></div><div id="cmpOut"></div></div>`}
function doCompare(){const a=ARTICULOS[+document.getElementById('cmpA').value],b=ARTICULOS[+document.getElementById('cmpB').value];document.getElementById('cmpOut').innerHTML=`<div class="legal-grid" style="margin-top:14px">${[a,b].map(x=>`<div class="legal-box"><h4>Artículo ${x.numero}</h4><p><b>${esc(x.titulo)}</b></p><p style="margin-top:8px">${esc(x.conducta)}</p><hr style="border:0;border-top:1px solid var(--line)"><p class="penalty">${esc(penaltySummary(x))}</p>${x.agravantes.length?`<p><b>Agravantes:</b> ${esc(x.agravantes.join(' '))}</p>`:''}</div>`).join('')}</div>`}
function renderSearch(){main.innerHTML=header('Buscador','Busca por artículo, delito, pena, comiso o palabra clave')+`<input id="searchBox" class="search" placeholder="Ej. portación, comiso, reincidencia, 12 años..." oninput="runSearch()"><div id="searchOut" class="article-list" style="margin-top:12px">${arr().map(rowArticle).join('')}</div>`}
function runSearch(){let q=document.getElementById('searchBox').value.toLowerCase().trim();let items=arr().filter(a=>JSON.stringify(a).toLowerCase().includes(q)||String(a.numero).includes(q));document.getElementById('searchOut').innerHTML=items.map(a=>`<div onclick="openArticle(${a.numero})" style="cursor:pointer">${rowArticle(a)}</div>`).join('')||'<p class="muted">Sin resultados.</p>'}
function renderSettings(){main.innerHTML=header('Ajustes y respaldo','Exporta/importa progreso y configura sincronización')+`<div class="grid two"><div class="card"><h3>Progreso local</h3><p class="muted">El progreso se guarda automáticamente en este navegador.</p><div class="toolbar"><button class="btn" onclick="exportProgress()">Exportar JSON</button><label class="btn">Importar JSON<input type="file" accept="application/json" style="display:none" onchange="importProgress(this.files[0])"></label><button class="btn bad" onclick="resetProgress()">Reiniciar progreso</button></div></div><div class="card"><h3>Sincronización Supabase</h3><p class="muted">Configura tu proyecto de Supabase para usar el mismo progreso en celular, iPad y computadora.</p><button class="btn primary" onclick="openCloud()">Configurar / sincronizar</button></div></div><div class="card" style="margin-top:14px"><h3>Control de calidad de esta versión</h3><ul><li>40 artículos: 99 al 138.</li><li>Sin duplicados.</li><li>Preguntas derivadas de <code>ARTICULOS</code>.</li><li>Distractores de penas tomados de datos reales de otros artículos.</li><li>Dominio 0–100 con límites para evitar dominar por una sola respuesta.</li><li>SM-2 simplificado y localStorage.</li></ul></div>`}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`penas-lam-progreso-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)}
async function importProgress(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!x.progress)throw Error('Archivo no válido');state=x;for(let n=99;n<=138;n++)state.progress[n]={...defaultArticleState(),...(state.progress[n]||{})};saveState();render();alert('Progreso importado.')}catch(e){alert('No se pudo importar: '+e.message)}}
function resetProgress(){if(confirm('¿Reiniciar todo el progreso local? Esta acción no se puede deshacer salvo que tengas un respaldo.')){state=defaultState();saveState();render()}}
// ---- Supabase REST sync, sin dependencia externa ----
function cloudCfg(){try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY))||{};return {...c,url:c.url||SUPABASE_DEFAULT_URL,key:c.key||SUPABASE_DEFAULT_KEY}}catch(e){return {url:SUPABASE_DEFAULT_URL,key:SUPABASE_DEFAULT_KEY}}}
function saveCloudCfg(x){localStorage.setItem(CLOUD_KEY,JSON.stringify(x))}
function openCloud(){const c=cloudCfg();const m=document.getElementById('cloudModal');document.getElementById('cloudCard').innerHTML=`<div class="top"><div><h2>Sincronización</h2><p>Supabase Auth + PostgreSQL</p></div><button class="btn" onclick="closeCloud()">✕</button></div><div class="notice">La nube de Penas LAM ya está configurada. Solo necesitas crear tu usuario o iniciar sesión. La aplicación usa únicamente una clave pública de Supabase y cada usuario queda protegido por Row Level Security.</div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Supabase Project URL</label><input id="sbUrl" value="${esc(c.url||'')}" readonly></div><div class="field"><label>Publishable / anon key</label><input id="sbKey" value="${esc(c.key||'')}" readonly></div><div class="field"><label>Correo</label><input id="sbEmail" value="${esc(c.email||'')}" type="email"></div><div class="field"><label>Contraseña</label><input id="sbPass" type="password"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="saveCloudForm()">Guardar configuración</button><button class="btn" onclick="signUp()">Crear usuario</button><button class="btn primary" onclick="signIn()">Iniciar sesión</button><button class="btn ok" onclick="syncNow()">Sincronizar ahora</button><button class="btn" onclick="pullCloud()">Traer de nube</button><button class="btn" onclick="signOut()">Cerrar sesión</button></div><div id="cloudStatus" class="footer-note">${c.user_id?'Sesión guardada para usuario '+esc(c.email||c.user_id):'Sin sesión iniciada.'}</div>`;m.classList.add('show')}
function closeCloud(){document.getElementById('cloudModal').classList.remove('show')}
function cloudStatus(s){const x=document.getElementById('cloudStatus');if(x)x.textContent=s}
function saveCloudForm(){let c=cloudCfg();c.url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');c.key=document.getElementById('sbKey').value.trim();c.email=document.getElementById('sbEmail').value.trim();saveCloudCfg(c);cloudStatus('Configuración guardada.')}
async function refreshCloudSession(){let c=cloudCfg();if(!c.refresh_token)return false;let r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.refresh_token})});if(!r.ok)return false;let d=await r.json();c.access_token=d.access_token;c.refresh_token=d.refresh_token||c.refresh_token;c.user_id=d.user?.id||c.user_id;saveCloudCfg(c);return true}
async function sbFetch(path,opt={}){let c=cloudCfg();if(!c.url||!c.key)throw Error('Falta URL o clave pública de Supabase.');const retried=!!opt._retried;const fetchOpt={...opt};delete fetchOpt._retried;let h={'apikey':c.key,'Content-Type':'application/json',...(fetchOpt.headers||{})};if(c.access_token)h.Authorization='Bearer '+c.access_token;let r=await fetch(c.url+path,{...fetchOpt,headers:h});if(r.status===401&&!retried&&c.refresh_token&&!path.includes('/auth/v1/token')){if(await refreshCloudSession())return sbFetch(path,{...opt,_retried:true})}if(!r.ok){let t=await r.text();throw Error(`${r.status}: ${t.slice(0,300)}`)}if(r.status===204)return null;let txt=await r.text();return txt?JSON.parse(txt):null}
async function signUp(){try{saveCloudForm();let c=cloudCfg(),pass=document.getElementById('sbPass').value;if(!c.email||!pass)throw Error('Ingresa correo y contraseña.');let d=await sbFetch('/auth/v1/signup?redirect_to=https%3A%2F%2Fpenas-lam.netlify.app%2F',{method:'POST',body:JSON.stringify({email:c.email,password:pass})});if(d?.access_token){c.access_token=d.access_token;c.refresh_token=d.refresh_token;c.user_id=d.user?.id;saveCloudCfg(c);await syncNow(true)}cloudStatus(d?.access_token?'Usuario creado, sesión iniciada y progreso sincronizado.':'Usuario creado. Revisa tu correo para confirmar la cuenta y luego inicia sesión.')}catch(e){cloudStatus('Error: '+e.message)}}
async function signIn(){try{saveCloudForm();let c=cloudCfg(),pass=document.getElementById('sbPass').value;if(!c.email||!pass)throw Error('Ingresa correo y contraseña.');let d=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:c.email,password:pass})});c.access_token=d.access_token;c.refresh_token=d.refresh_token;c.user_id=d.user?.id;saveCloudCfg(c);cloudStatus('Sesión iniciada. Sincronizando...');await pullCloud(true);await syncNow(true);cloudStatus('Sesión iniciada y progreso sincronizado.')}catch(e){cloudStatus('Error: '+e.message)}}
async function signOut(){let c=cloudCfg();try{if(c.access_token)await sbFetch('/auth/v1/logout',{method:'POST'})}catch(e){}delete c.access_token;delete c.refresh_token;delete c.user_id;saveCloudCfg(c);cloudStatus('Sesión cerrada. El progreso local permanece en este dispositivo.')}
function cloudRows(){const c=cloudCfg();return arr().map(a=>{let p=state.progress[a.numero];return {user_id:c.user_id,articulo:a.numero,dominio:domain(a.numero),intentos:p.attempts,correctas:p.correct,incorrectas:p.wrong,flashcards:p.flashSeen,ease_factor:p.ease,intervalo:p.interval,repeticiones:p.repetitions,ultima_revision:p.lastStudy,proxima_revision:p.nextReview,errores:p.errors,payload:p,updated_at:p.updatedAt||state.updatedAt}})}
async function syncNow(silent=false){try{let c=cloudCfg();if(!c.access_token||!c.user_id)throw Error('Primero inicia sesión.');if(!silent)cloudStatus('Sincronizando...');await sbFetch('/rest/v1/article_progress?on_conflict=user_id,articulo',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(cloudRows())});let pending=state.attemptLog.filter(x=>!x.synced);if(pending.length){let rows=pending.map(x=>({id:x.id,user_id:c.user_id,articulo:x.articulo,tipo_pregunta:x.type,correcta:x.correct,tipo_error:x.errorType,fecha:x.at,metadata:x}));await sbFetch('/rest/v1/attempts?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(rows)});pending.forEach(x=>x.synced=true)}await sbFetch('/rest/v1/user_settings?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{user_id:c.user_id,configuracion:state.settings,updated_at:nowISO()}])});saveState(true);if(!silent)cloudStatus('Sincronización completada: progreso local → nube.')}catch(e){if(!silent)cloudStatus('Error de sincronización: '+e.message);else console.warn('Sync:',e.message)}}
async function pullCloud(silent=false){try{let c=cloudCfg();if(!c.access_token||!c.user_id)throw Error('Primero inicia sesión.');if(!silent)cloudStatus('Descargando progreso...');let rows=await sbFetch('/rest/v1/article_progress?select=*&order=articulo.asc');for(const r of rows||[]){let n=r.articulo;if(n<99||n>138)continue;let local=state.progress[n],remote=r.payload||{};let lt=new Date(local.updatedAt||0).getTime(),rt=new Date(r.updated_at||0).getTime();if(rt>=lt)state.progress[n]={...defaultArticleState(),...remote,attempts:r.intentos??remote.attempts??0,correct:r.correctas??remote.correct??0,wrong:r.incorrectas??remote.wrong??0,flashSeen:r.flashcards??remote.flashSeen??0,ease:r.ease_factor??remote.ease??2.5,interval:r.intervalo??remote.interval??0,repetitions:r.repeticiones??remote.repetitions??0,lastStudy:r.ultima_revision??remote.lastStudy??null,nextReview:r.proxima_revision??remote.nextReview??null,errors:r.errores||remote.errors||defaultArticleState().errors,updatedAt:r.updated_at}}
let attempts=await sbFetch('/rest/v1/attempts?select=*&order=fecha.asc&limit=5000');let map=new Map(state.attemptLog.map(x=>[x.id,x]));for(const r of attempts||[]){if(!map.has(r.id))map.set(r.id,{id:r.id,articulo:r.articulo,correct:r.correcta,type:r.tipo_pregunta,errorType:r.tipo_error,at:r.fecha,synced:true,...(r.metadata||{})})}state.attemptLog=[...map.values()].sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(-5000);saveState(true);if(!silent)cloudStatus('Progreso descargado y combinado.');render()}catch(e){if(!silent)cloudStatus('Error al traer de nube: '+e.message);else console.warn('Pull:',e.message)}}
let cloudSyncTimer=null;function queueCloudSync(){const c=cloudCfg();if(!c.access_token||!c.user_id||!navigator.onLine)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>syncNow(true),1500)}
window.addEventListener('online',()=>queueCloudSync());
document.getElementById('cloudModal').addEventListener('click',e=>{if(e.target.id==='cloudModal')closeCloud()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
</script>
</body>
